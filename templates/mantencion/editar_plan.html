{% extends 'base.html' %}

{% block title %}Editar plan — Vilas Motor{% endblock %}

{% block content %}
<h1>Editar plan</h1>
<p class="page-subtitle">{{ plan.nombre }} — {{ plan.tipo_equipo.nombre }}</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="{% url 'mantencion:planes' %}">Cancelar</a>
</form>
{% endblock %}
