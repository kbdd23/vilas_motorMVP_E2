{% extends 'base.html' %}

{% block title %}Editar plan — Vilas Motor{% endblock %}

{% block content %}
<section class="page-hero">
    <div class="container">
        <div class="hero-top">
            <div>
                <span class="eyebrow">Mantención</span>
                <h1>Editar plan</h1>
                <p class="sub">{{ plan.nombre }} — {{ plan.tipo_equipo.nombre }}</p>
            </div>
        </div>
    </div>
</section>

<div class="container">
    <section class="panel">
        <div class="panel-cuerpo" style="padding:24px">
            <form method="post" class="form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-secondary" href="{% url 'mantencion:planes' %}">Cancelar</a>
            </form>
        </div>
    </section>
</div>
{% endblock %}
