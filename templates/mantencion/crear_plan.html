{% extends 'base.html' %}

{% block title %}Crear plan — Vilas Motor{% endblock %}

{% block content %}
<h1>Crear plan de mantención</h1>
<p class="page-subtitle">Asociar un plan a un tipo de equipo.</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Crear</button>
    <a class="btn btn-secondary" href="{% url 'mantencion:planes' %}">Cancelar</a>
</form>
{% endblock %}
