{% extends 'base.html' %}

{% block title %}Registrar insumo — Vilas Motor{% endblock %}

{% block content %}
<h1>Registrar insumo</h1>
<p class="page-subtitle">{{ orden.numero_ot }} — {{ orden.equipo.codigo }}</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Registrar</button>
    <a class="btn btn-secondary" href="{% url 'mantencion:detalle_orden' orden.id %}">Cancelar</a>
</form>
{% endblock %}
