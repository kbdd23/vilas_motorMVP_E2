{% extends 'base.html' %}

{% block title %}Editar servicio — Vilas Motor{% endblock %}

{% block content %}
<h1>Editar servicio</h1>
<p class="page-subtitle">{{ servicio.nombre }} · {{ servicio.plan.nombre }}</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="{% url 'mantencion:planes' %}">Cancelar</a>
</form>
{% endblock %}
