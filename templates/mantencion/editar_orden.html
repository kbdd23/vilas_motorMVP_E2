{% extends 'base.html' %}

{% block title %}Editar {{ orden.numero_ot }} — Vilas Motor{% endblock %}

{% block content %}
<h1>Editar {{ orden.numero_ot }}</h1>
<p class="page-subtitle">Corregir una orden antes de cerrarla. Una vez cerrada no se puede tocar.</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="{% url 'mantencion:detalle_orden' orden.id %}">Cancelar</a>
</form>
{% endblock %}
