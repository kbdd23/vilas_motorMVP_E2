{% extends 'base.html' %}

{% block title %}Crear insumo — Vilas Motor{% endblock %}

{% block content %}
<section class="page-hero">
    <div class="container">
        <div class="hero-top">
            <div>
                <span class="eyebrow">Catálogos</span>
                <h1>Crear insumo</h1>
                <p class="sub">Agregar un insumo al catálogo de mantención.</p>
            </div>
        </div>
    </div>
</section>

<div class="container">
    <section class="panel">
        <div class="panel-cuerpo" style="padding:24px">
            <form method="post" class="form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Crear</button>
                <a class="btn btn-secondary" href="{% url 'insumos:insumos' %}">Cancelar</a>
            </form>
        </div>
    </section>
</div>
{% endblock %}
