{% extends 'base.html' %}

{% block title %}Recuperar acceso — Vilas Motor{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Recuperar acceso</h1>
    <p class="page-subtitle">Te enviaremos un enlace seguro a tu correo.</p>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar enlace</button>
    </form>
    <p class="auth-helper"><a href="{% url 'cuentas:login' %}">Volver a iniciar sesión</a></p>
</div>
{% endblock %}
