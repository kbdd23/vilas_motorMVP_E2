{% extends 'base.html' %}

{% block title %}Recuperar acceso — Vilas Motor{% endblock %}

{% block content %}
<div class="container" style="max-width:460px; padding-top:48px">
    <div class="panel">
        <div class="panel-encabezado"><div><h2>Recuperar acceso</h2><p>Te enviaremos un enlace seguro a tu correo.</p></div></div>
        <div class="panel-cuerpo" style="padding:24px">
            <form method="post" class="form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Enviar enlace</button>
            </form>
            <p class="auth-helper" style="margin-top:12px"><a href="{% url 'cuentas:login' %}">Volver a iniciar sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
