{% extends 'base.html' %}

{% block title %}Crear arriendo — Vilas Motor{% endblock %}

{% block content %}
<section class="page-hero">
    <div class="container">
        <div class="hero-top">
            <div>
                <span class="eyebrow">Arriendos</span>
                <h1>Crear arriendo</h1>
                <p class="sub">Asignar un equipo a un cliente con fecha de inicio.</p>
            </div>
        </div>
    </div>
</section>

<div class="container">
    <section class="panel">
        <div class="panel-cuerpo" style="padding:24px">
            <form method="post" class="form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Crear</button>
                <a class="btn btn-secondary" href="{% url 'arriendos:arriendos' %}">Cancelar</a>
            </form>
        </div>
    </section>
</div>
{% endblock %}
