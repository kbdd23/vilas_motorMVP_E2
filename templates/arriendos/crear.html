{% extends 'base.html' %}

{% block title %}Crear arriendo — Vilas Motor{% endblock %}

{% block content %}
<h1>Crear arriendo</h1>
<p class="page-subtitle">Asignar un equipo a un cliente con fecha de inicio.</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Crear</button>
    <a class="btn btn-secondary" href="{% url 'arriendos:arriendos' %}">Cancelar</a>
</form>
{% endblock %}
