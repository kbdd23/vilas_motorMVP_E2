{% extends 'base.html' %}

{% block title %}Editar {{ equipo.codigo }} — Vilas Motor{% endblock %}

{% block content %}
<section class="page-hero">
    <div class="container">
        <div class="hero-top">
            <div>
                <span class="eyebrow">Flota</span>
                <h1>Editar {{ equipo.codigo }}</h1>
                <p class="sub">Modificar los datos de la ficha del equipo.</p>
            </div>
        </div>
    </div>
</section>

<div class="container">
    <section class="panel">
        <div class="panel-cuerpo" style="padding:24px">
            <form method="post" class="form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-secondary" href="{% url 'flota:detalle_equipo' equipo.id %}">Cancelar</a>
            </form>
        </div>
    </section>
</div>
{% endblock %}
