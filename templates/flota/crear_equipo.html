{% extends 'base.html' %}

{% block title %}Crear equipo — Vilas Motor{% endblock %}

{% block content %}
<h1>Crear equipo</h1>
<p class="page-subtitle">Agregar una máquina al inventario de la flota.</p>

<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Crear</button>
    <a class="btn btn-secondary" href="{% url 'flota:equipos' %}">Cancelar</a>
</form>
{% endblock %}
